<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    The game, drawn rather than written: a board of nine, one row taken, one
    tile still locked. No glyph, so it renders the same on a device with no CJK
    face — the same reasoning as wuxing's icon, which drew its rule graph
    instead of its name.

    Full-bleed on purpose. This is the maskable bitmap source: Android cuts it
    to whatever silhouette the launcher uses, so the artwork sits inside the
    central 80% and the background runs to the edge. The generated icon.svg
    keeps its own rounded corners instead, for the contexts nothing masks.

    Regenerate the PNGs with the tool macOS already has:
      qlmanage -t -s 192 -o public public/icon-source.svg
      qlmanage -t -s 512 -o public public/icon-source.svg
    then rename `icon-source.svg.png` to `icon-<size>.png`.
  -->
  <rect width="512" height="512" fill="#f4f0e6"/>
  <g fill="none" stroke="#3b4a63" stroke-width="10" stroke-linejoin="round">
    <rect x="97" y="97" width="94" height="94" rx="12"/>
    <rect x="209" y="97" width="94" height="94" rx="12"/>
    <rect x="321" y="97" width="94" height="94" rx="12"/>
    <rect x="97" y="321" width="94" height="94" rx="12"/>
    <rect x="209" y="321" width="94" height="94" rx="12"/>
    <rect x="321" y="321" width="94" height="94" rx="12"/>
  </g>
  <g fill="#3b4a63">
    <rect x="97" y="209" width="94" height="94" rx="12"/>
    <rect x="209" y="209" width="94" height="94" rx="12"/>
    <rect x="321" y="209" width="94" height="94" rx="12"/>
  </g>
  <g fill="none" stroke="#3b4a63" stroke-width="9" stroke-linecap="round">
    <path d="M345 141v-16a23 23 0 0 1 46 0v16"/>
  </g>
  <rect x="337" y="141" width="62" height="30" rx="8" fill="#f4f0e6" stroke="#3b4a63" stroke-width="9"/>
</svg>
